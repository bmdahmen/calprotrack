name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
      - migrations/**
      - .github/workflows/deploy-worker.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply D1 migrations and deploy to Cloudflare Workers
        run: |
          npm install -g wrangler
          wrangler d1 migrations apply calorie --remote || echo "::warning::D1 migrations step failed (deploy API token lacks D1 permission) - continuing; the worker self-heals schema on demand"
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
